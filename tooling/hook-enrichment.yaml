    request: RequestRedeemDETHHook
    fulfill: ClaimAssetsDETHHook
    cancel: null
    claimCancel: null
  ethena:
    request: EthenaCooldownSharesHook
    fulfill: EthenaUnstakeHook
    cancel: null
    claimCancel: null
  firelight:
    request: RedeemFirelightVaultHook
    fulfill: ClaimWithdrawFirelightVaultHook
    cancel: null
    claimCancel: null

