  EulerRepayAndWithdrawHook: [{direction: IN, denomination: TOKEN}, {direction: OUT, denomination: TOKEN}]
  # MorphoLendHook: input is loan-token amount (TOKEN denomination is correct).
  # outAmount is Morpho supply shares — non-transferable internal accounting units distinct from
  # ERC-4626 vault shares. A "UNITS" denomination for output is deferred because amountRoles()
  # expresses input denomination only; there is no denom field on outAmount in ISuperHookResult.
  # Note: SHARES does exist in the Denomination enum (ISuperHook.sol) and is used by Redeem hooks;
  # the deferral of UNITS is not because SHARES is absent, but because UNITS would describe outAmount
  # semantics that amountRoles does not expose.

  # MorphoWithdraw: dual-slot with XOR invariant
  MorphoWithdrawHook: [{direction: IN, denomination: ASSETS}, {direction: IN, denomination: SHARES}]

# ── Hooks advertising ISuperHookLoans via ERC-165 ────────────────────────────
# Only newly compiled (V2) loan hooks advertise the loan interface on-chain; legacy deployed
# loan hook addresses keep their old bytecode and rely on the OMS fallback until migrated.
loanInterfaceHooks:
  - MorphoSupplyAndBorrowHookV2
  - MorphoRepayHookV2
  - MorphoRepayAndWithdrawHookV2
  - AaveV3SupplyAndBorrowHookV2
  - AaveV3RepayHookV2
  - AaveV3RepayAndWithdrawHookV2
  - AaveV4SupplyAndBorrowHookV2
  - AaveV4RepayHookV2
  - AaveV4RepayAndWithdrawHookV2
  - EulerDepositCollateralAndBorrowHook
  # EulerRepayHook intentionally absent: its reserved-zero collateral slot makes the inherited
  # getCollateralTokenBalance revert, so it honestly does NOT advertise ISuperHookLoans
  - EulerRepayAndWithdrawHook

