# Hook Classification Manifest
# Canonical intent x stage classification for all 120 hooks in v2-core
# CI-linted against on-chain hookType via scripts/lint_hook_manifest.py
#
# Design invariants:
#   T1: Array is ordered — position = execution order of legs
#   T2: legSizing[i] maps 1:1 to amountRoles[i] by index
#   T3: Each leg's (intent, stage) must be consistent with hook-level hookType
#   T4: All intents/stages come from the canonical vocabulary below

vocabulary:
  intents:
    - deposit
    - withdraw
    - rewards
    - swap
    - bridge
    - stake
    - unstake
    - lend
    - borrow
    - repay
    - transfer
    - config
    - permissions
  stages:
    - instant
    - request
    - fulfill
    - claim
    - cancel

# P2 conformance rules (hookType consistency):
#   intent in {config, permissions, transfer}     => hookType = NONACCOUNTING
#   intent = deposit, stage = instant              => hookType = INFLOW
#   intent = withdraw, stage = instant             => hookType = OUTFLOW
#   intent in {swap, bridge, stake, unstake}       => hookType = NONACCOUNTING
#   intent in {lend, borrow, repay}                => hookType = NONACCOUNTING
#   intent = deposit, stage != instant             => hookType = NONACCOUNTING  (async lifecycle)
#   intent = withdraw, stage != instant            => hookType = NONACCOUNTING  (async lifecycle, except fulfill)
#   intent = withdraw, stage = fulfill, hookType = OUTFLOW is also valid (e.g. EthenaUnstake)
#   intent = deposit, stage = fulfill, hookType = INFLOW is also valid (e.g. Deposit7540)

